<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Statement Page</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../styles/style.css" />
</head>

<body class="bg-dark text-light">
    <div class="container mt-5">
        <h3 class="mb-4">Statement Page</h3>
        <!-- Add Form Row -->
        <div class="row fw-bold border-bottom pb-2">
            <div class="col-1">Id</div>
            <div class="col-2">Date</div>
            <div class="col-3">Header</div>
            <div class="col-2">Credit</div>
            <div class="col-2">Debit</div>
            <div class="col-2">Action</div>
        </div>
        <!-- Add Inputs -->
        <div class="row align-items-center py-2 border-bottom">
            <div class="col-1">#</div>
            <div class="col-2">
                <input type="date" id="date" class="form-control form-control-sm" />
            </div>
            <div class="col-3">
                <input type="text" id="header" class="form-control form-control-sm" />
            </div>
            <div class="col-2">
                <input type="number" id="credit" class="form-control form-control-sm" />
            </div>
            <div class="col-2">
                <input type="number" id="debit" class="form-control form-control-sm" />
            </div>
            <div class="col-2">
                <button id="addBtn" class="btn btn-success btn-sm w-100">ADD</button>
            </div>
        </div>
    </div>
    <script src="../lib/script.js"></script>
</body>

</html>
